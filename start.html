<!DOCTYPE html><html lang="ru"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Запуск jedit.html</title>    <style>        * {            margin: 0;            padding: 0;            box-sizing: border-box;            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;        }                body {            display: flex;            justify-content: center;            align-items: center;            min-height: 100vh;            background: linear-gradient(135deg, #dce6fb, #dcfbee);            padding: 20px;        }                .container {            background: rgba(255, 255, 255, 0.9);            padding: 2rem;            border-radius: 16px;            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);            text-align: center;            max-width: 500px;            width: 100%;            backdrop-filter: blur(5px);        }                h1 {            margin-bottom: 1.5rem;            color: #333;            font-weight: 600;        }                .input-group {            display: flex;            margin-bottom: 1.5rem;        }                input {            flex: 1;            padding: 12px 16px;            border: 2px solid #ddd;            border-right: none;            border-radius: 8px 0 0 8px;            font-size: 16px;            outline: none;            transition: border-color 0.3s;        }                input:focus {            border-color: #6e8efb;        }                button {            background: #6e8efb;            color: white;            border: none;            padding: 12px 24px;            border-radius: 0 8px 8px 0;            cursor: pointer;            font-size: 16px;            font-weight: 600;            transition: background 0.3s;        }                button:hover {            background: #5a7ce2;        }                .hint {            color: #666;            font-size: 14px;            margin-top: 10px;        }                .message {            margin-top: 1.5rem;            padding: 12px;            border-radius: 8px;            background: #f8f9fa;            display: none;        }    </style></head><body>    <div class="container">        <h1>Запуск WASM</h1>        <div class="input-group">            <input type="text" id="fileInput" value="wasm/jedit.html">            <button id="launchBtn">Запустить</button>        </div>        <p class="hint">Введите имя файла и нажмите "Запустить"</p>        <div id="message" class="message"></div>    </div>    <script>        document.getElementById('launchBtn').addEventListener('click', function() {            const fileName = document.getElementById('fileInput').value.trim();            const messageEl = document.getElementById('message');                        if (fileName) {                try {                    // Попытка открыть файл                    window.open(fileName, '_blank');                    messageEl.textContent = `Запуск файла: ${fileName}`;                    messageEl.style.display = 'block';                    messageEl.style.background = '#e6f7e6';                    messageEl.style.color = '#2e7d32';                } catch (error) {                    messageEl.textContent = `Ошибка при открытии файла: ${error.message}`;                    messageEl.style.display = 'block';                    messageEl.style.background = '#ffe6e6';                    messageEl.style.color = '#c62828';                }            } else {                messageEl.textContent = 'Пожалуйста, введите имя файла';                messageEl.style.display = 'block';                messageEl.style.background = '#fff3cd';                messageEl.style.color = '#856404';            }        });                // Автоподсветка текста при загрузке        document.getElementById('fileInput').select();    </script></body></html>
