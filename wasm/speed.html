<!DOCTYPE HTML><HTML lang="ru"><HEAD>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0"><TITLE>Тест скорости</TITLE>  <input id="t01" type="text" value="30"  size="10px">  <input id="b01" type="button" value="fibonachi"  onClick="but_click1()">  <p>  <input id="t02" type="text" value="10001"  size="10px">  <input id="b02" type="button" value="pr_primes"  onClick="but_click2()">  <p>  <input id="t03" type="text" value="100"  size="10px">  <input id="b03" type="button" value="mul_matrix"  onClick="but_click3()">  <p>  <input id="t04" type="text" value="1000000"  size="10px">  <input id="b04" type="button" value="loop_while"  onClick="but_click4()">  <p>  <input id="t05" type="text" value="1000000"  size="10px">  <input id="b05" type="button" value="loop_for"  onClick="but_click5()">  <p>  <input id="t06" type="text" value="1000000"  size="10px">  <input id="b06" type="button" value="loop_cal"  onClick="but_click6()">  <p>  <button onclick="beep()">test_beep</button> <script type="text/javascript">   // ---------------------------------------------------------    function fibonachi(n) {      if (n === 1) return 1;      if (n === 2) return 1;      return fibonachi(n-1) + fibonachi(n-2)   };   function but_click1() {      var text = document.getElementById("t01");      var butt = document.getElementById("b01");      var n = parseInt(text.value);      var t = performance.now();      n = fibonachi( n );          t = performance.now() - t;      butt.value = "fibonachi: " + t;      //alert("fibonachi = " + n + '   millisec ' + t);   };   // ---------------------------------------------------------   function is_primes(n) {      if (n <= 1) return 0;      for (let i = 2; i <= Math.sqrt(n); i++) {           if (n % i === 0) return 0;      };      return 1;   };   function pr_primes(n) {      for (let i = 2; i <= n; i++) {          var k = is_primes(i);      };   };   function but_click2() {      var text = document.getElementById("t02");      var butt = document.getElementById("b02");      var n = parseInt(text.value);      var t = performance.now();      n = pr_primes( n  );          t = performance.now() - t;      butt.value = "pr_primes: " + t;   };   // ---------------------------------------------------------   function mul_matrix(a, b) {      let result = new Array(a.length);      for (let i = 0; i < a.length; i++) {      result[i] = new Array(b[0].length).fill(0);      for (let j = 0; j < b[0].length; j++) {      for (let k = 0; k < a[0].length; k++) {        // JS-движок тратит время на проверки типов        a[i][k] = 0;        b[k][j] = 0;        result[i][j] += a[i][k] * b[k][j];      }      }      }      return result;   };   function but_click3() {      var text = document.getElementById("t03");      var butt = document.getElementById("b03");      var n = parseInt(text.value);      var t = performance.now();      const A = Array.from( {length: n}, () => Array.from( {length: n} ));      const B = Array.from( {length: n}, () => Array.from( {length: n} ));      n = mul_matrix(A, B);          t = performance.now() - t;      butt.value = "mul_matrix: " + t;   };    // ---------------------------------------------------------   function loop_while(n) {      var r = 0;      while (r < n) { r++ };   };   function but_click4() {      var text = document.getElementById("t04");      var butt = document.getElementById("b04");      var n = parseInt(text.value);      var t = performance.now();      n = loop_while( n  );          t = performance.now() - t;      butt.value = "loop_while: " + t;   };   // ---------------------------------------------------------   function loop_for(n) {      for (var r = 0; r < n; r++) {};   };   function but_click5() {      var text = document.getElementById("t05");      var butt = document.getElementById("b05");      var n = parseInt(text.value);      var t = performance.now();      n = loop_for( n  );          t = performance.now() - t;      butt.value = "loop_for: " + t;   };   // ---------------------------------------------------------      var r = 0;      function null_proc(n) { r = n };   function loop_cal(n) {      for (var r = 0; r < n; r++) { null_proc(r) };   };   function but_click6() {      var text = document.getElementById("t06");      var butt = document.getElementById("b06");      var n = parseInt(text.value);      var t = performance.now();      n = loop_cal( n  );          t = performance.now() - t;      butt.value = "loop_cal: " + t;   };   // ---------------------------------------------------------   function beep(freq=800,  msec=100 ) {   let ctx = new AudioContext(   ) ;   let osc = ctx.createOscillator();    osc.connect(ctx.destination);   osc.type = "sine";    osc.frequency.value =  freq ;   osc.start(ctx.currentTime      );    osc.stop( ctx.currentTime                     + msec / 1000);    };</script> </HEAD><BODY></BODY></HTML>
