<!doctype html><html lang="ru"><head>   <meta charset = "utf-8">   <title>Oberon-2M</title>   <style>canvas:focus {           outline:none}      h1 {font-size: 1.0em;           position: fixed;      right: 10px;      bottom: 0px;}</style></head><body>   <h1>Oberon-2M ORM</h1>   <script type="module">      import * as lib_A from "./jlibc.js"      import * as lib_B from "./jwlib.js"   const importObj = {         aormJwlib : {                       puts : lib_A.puts,                       pnum : lib_A.pnum,                     },         aormJAP : {                       mbox : lib_B.mbox,                     },   };   WebAssembly.instantiateStreaming(fetch("ztest.wasm"),                                            importObj )   .then (async (wasm) => {                   console.log( "loaded successfully!");                   if (lib_A.init) {                       lib_A.init(                         wasm.instance.exports.memory,                         wasm.instance.exports.table  );                   };                   if (lib_B.init) {                       lib_B.init(                         wasm.instance.exports.memory,                         wasm.instance.exports.table  );                   };                   wasm.instance.exports.main(        );   })   .catch (err => {console.error("loading failed:",err);   });   </script></body></html>
