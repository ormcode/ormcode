<!doctype html><html lang="ru"><head>   <meta charset = "utf-8">   <title>Oberon-2M</title>   <style>canvas:focus {           outline:none}      h1 {font-size: 1.0em;           position: fixed;      right: 10px;      bottom: 0px;}</style></head><body>   <h1>Oberon-2M ORM</h1>   <script type="module">      import * as lib_A from "./jlibc.js"      import * as lib_B from "./jlibc.js"      import * as lib_C from "./jlibd.js"   const importObj = {         aormJwlib : {                       puts : lib_A.puts,                       pnum : lib_A.pnum,                     },         asmlJlibc : {                       puts : lib_B.puts,                       mbox : lib_B.mbox,                       pnum : lib_B.pnum,                       exit : lib_B.exit,                       now : lib_B.now,                       beep : lib_B.beep,                       past : lib_B.past,                       copy : lib_B.copy,                       wait : lib_B.wait,                     },         asmlJlibd : {                       screen_w : lib_C.screen_w,                       screen_h : lib_C.screen_h,                       outer_w : lib_C.outer_w,                       outer_h : lib_C.outer_h,                       inner_w : lib_C.inner_w,                       inner_h : lib_C.inner_h,                       error : lib_C.error,                       is_canvas : lib_C.is_canvas,                       set_style : lib_C.set_style,                       set_cursor : lib_C.set_cursor,                       get_context : lib_C.get_context,                       fre_context : lib_C.fre_context,                       put_image : lib_C.put_image,                       put_ipart : lib_C.put_ipart,                       new_msgtime : lib_C.new_msgtime,                       set_timeout : lib_C.set_timeout,                       fre_timeout : lib_C.fre_timeout,                       set_interval : lib_C.set_interval,                       fre_interval : lib_C.fre_interval,                       flg_keyboard : lib_C.flg_keyboard,                       add_kevent : lib_C.add_kevent,                       add_mevent : lib_C.add_mevent,                       rem_kevent : lib_C.rem_kevent,                       rem_mevent : lib_C.rem_mevent,                       set_capture : lib_C.set_capture,                       uns_capture : lib_C.uns_capture,                       blk_defaultt : lib_C.blk_defaultt,                       unb_defaultt : lib_C.unb_defaultt,                       domElement : lib_C.domElement,                       cnvElement : lib_C.cnvElement,                       freElement : lib_C.freElement,                       insElement : lib_C.insElement,                       s_position : lib_C.s_position,                       font_canvas : lib_C.font_canvas,                       free_canvas : lib_C.free_canvas,                       get_maxw : lib_C.get_maxw,                       get_maxh : lib_C.get_maxh,                       get_ascn : lib_C.get_ascn,                       get_dscn : lib_C.get_dscn,                       get_rast : lib_C.get_rast,                     },   };   WebAssembly.instantiateStreaming(fetch("jgrid.wasm"),                                            importObj )   .then (async (wasm) => {                   console.log( "loaded successfully!");                   if (lib_A.init) {                       lib_A.init(                         wasm.instance.exports.memory,                         wasm.instance.exports.table  );                   };                   if (lib_B.init) {                       lib_B.init(                         wasm.instance.exports.memory,                         wasm.instance.exports.table  );                   };                   if (lib_C.init) {                       lib_C.init(                         wasm.instance.exports.memory,                         wasm.instance.exports.table  );                   };                   wasm.instance.exports.main(        );   })   .catch (err => {console.error("loading failed:",err);   });   </script></body></html>
